<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Послание</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Forum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Cormorant Garamond",Georgia,serif;background:#0b0b0d;color:#fff;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#bar{flex:none;background:#000;padding:8px 10px 10px;border-bottom:1px solid #333;font-family:-apple-system,Roboto,sans-serif}
#bar p{font-size:11px;color:#888;margin-bottom:6px}
#tabs{display:flex;gap:6px;overflow-x:auto}
#tabs button{flex:none;border:1px solid #444;background:#1c1c1c;color:#ccc;border-radius:999px;padding:7px 13px;font-size:13px;font-family:inherit}
#tabs button.on{background:#fff;color:#000;border-color:#fff;font-weight:600}
#stage{flex:1;position:relative;overflow:hidden}
.v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:26px 22px 28px}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
#toast{position:fixed;left:16px;right:16px;bottom:20px;background:#fff;color:#111;border-radius:14px;padding:14px 16px;font:14px/1.35 -apple-system,Roboto,sans-serif;box-shadow:0 10px 40px #000a;transform:translateY(200px);opacity:0;transition:.3s;z-index:9}
#toast.on{transform:none;opacity:1}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.in{animation:fade .7s both}
.btns{display:flex;gap:12px;width:100%;max-width:360px;margin-top:auto;padding-top:22px}
.btns>*{flex:1;text-align:center;padding:15px 8px;font-family:Forum,"Cormorant Garamond",serif;font-size:19px;letter-spacing:.5px;border-radius:6px;animation:fade .6s both}
.end{margin:auto;text-align:center;animation:fade .6s both;max-width:320px}
.end h2{font-family:Forum,serif;font-weight:400;font-size:32px;margin-bottom:14px;letter-spacing:.5px}
.end p{font-size:20px;line-height:1.4;opacity:.88}
.back{display:block;margin:26px auto 0;background:none;border:0;color:inherit;opacity:.6;font-size:16px;text-decoration:underline}
.tap{font-family:Forum,serif;font-size:14px;letter-spacing:4px;text-transform:uppercase;opacity:.75;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.3}}

/* A scroll */
.sc{background:radial-gradient(circle at 50% 20%,#27402f 0,#0e1a13 70%);color:#f0e6cf}
.sc .hd{font-family:Forum,serif;font-size:14px;letter-spacing:5px;text-transform:uppercase;color:#c9a959;margin-bottom:18px}
.parch{width:100%;max-width:360px;background:linear-gradient(175deg,#efdfb8,#dcc594 60%,#c9ae78);color:#3a2812;border-radius:4px;padding:30px 24px;position:relative;box-shadow:0 18px 50px #0009,inset 0 0 40px #8a6a3044;transition:max-height 1.1s ease,padding 1.1s;max-height:260px;overflow:hidden;text-align:center}
.parch.open{max-height:560px}
.parch h2{font-family:Forum,serif;font-weight:400;font-size:30px;letter-spacing:1px;margin-bottom:6px}
.parch .ln{font-size:20px;line-height:1.35;margin-top:12px;opacity:0}
.parch.open .ln{animation:fade .7s both}
.parch i{color:#8a2a1c}
.seal{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d2483a,#8a1c14 70%);box-shadow:0 6px 16px #0007,inset 0 -6px 10px #0004;display:flex;align-items:center;justify-content:center;font-size:38px;color:#f3c9b8;margin:26px auto 30px;border:0;transition:.6s;animation:bob 2s infinite}
@keyframes bob{50%{transform:scale(1.06)}}
.parch.open .seal{transform:scale(.4) rotate(40deg);opacity:0;height:0;margin:0;animation:none}
.sc .btns .y{background:#c9a959;color:#22180a}.sc .btns .n{border:1px solid #c9a95988;color:#e6d6ad;background:none}

/* B diary */
.di{background:radial-gradient(circle at 50% 0,#4a0f1a 0,#12060a 70%);color:#f1e3d6}
.di .hd{font-family:Forum,serif;font-size:14px;letter-spacing:5px;text-transform:uppercase;color:#c98a8a;margin-bottom:16px}
.pg{width:100%;max-width:360px;flex:none;min-height:400px;background:#f4ead7;color:#2b1a16;border-radius:3px 10px 10px 3px;padding:24px 22px 24px 34px;box-shadow:0 18px 50px #000b;border-left:10px solid #5a121d;font-family:Caveat,"Segoe Script",cursive;font-size:25px;line-height:32px;background-image:repeating-linear-gradient(transparent 0 31px,#c9b79a66 31px 32px);background-position:0 23px;white-space:pre-wrap}
.pg .dt{color:#8a2a2a;font-weight:700}
.di .btns .y{background:#8a1c2a;color:#fff}.di .btns .n{border:1px solid #c98a8a88;color:#e9cfcf;background:none}

/* C lot */
.lo{background:linear-gradient(180deg,#1a1c20,#0c0d10);color:#ece6d8}
.lo .hd{font-family:Forum,serif;font-size:14px;letter-spacing:5px;text-transform:uppercase;color:#d9a441;margin-bottom:6px}
.lo .h1{font-family:Forum,serif;font-size:34px;letter-spacing:2px;text-transform:uppercase;text-align:center;line-height:1.1}
.bowlw{position:relative;width:260px;height:230px;margin:26px 0 18px;flex:none}
.bowlw svg{width:100%;height:100%}
.slip{position:absolute;left:50%;top:92px;width:70px;height:26px;margin-left:-35px;background:#f3ead6;border-radius:2px;transition:1s cubic-bezier(.3,1.3,.5,1);box-shadow:0 3px 8px #0006}
.card{width:100%;max-width:340px;background:#f3ead6;color:#1c1a16;padding:22px 20px;text-align:center;border-top:6px solid #d9a441;animation:fade .7s both}
.card small{font-family:Forum,serif;letter-spacing:4px;text-transform:uppercase;font-size:13px;color:#8a6a1e}
.card h2{font-family:Forum,serif;font-weight:400;font-size:46px;letter-spacing:6px;margin:4px 0 8px}
.card p{font-size:20px;line-height:1.35}
.lo .btns .y{background:#d9a441;color:#14110a}.lo .btns .n{border:1px solid #d9a44188;color:#e8d9b5;background:none}

/* D orb */
.or{background:radial-gradient(circle at 50% 30%,#2a1f5c 0,#0a0820 70%);color:#ece8ff}
.or:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#fff 1px,transparent 1.5px);background-size:90px 110px,140px 90px;background-position:10px 20px,60px 70px;opacity:.35;pointer-events:none}
.or .hd{font-family:Forum,serif;font-size:14px;letter-spacing:5px;text-transform:uppercase;color:#b9a8ff;margin-bottom:18px;position:relative}
.orb{width:220px;height:220px;border-radius:50%;flex:none;position:relative;overflow:hidden;border:0;background:radial-gradient(circle at 35% 28%,#fff 0,#b9a8ff 12%,#5b3fd6 45%,#1b1147 80%);box-shadow:0 0 60px #7a5cff88,inset 0 -20px 40px #0006;transition:1s;margin:8px 0 20px}
.orb i{position:absolute;width:150px;height:150px;border-radius:50%;background:#fff;filter:blur(26px);opacity:.55;animation:mist 6s infinite alternate;transition:1.2s}
.orb i:nth-child(1){left:-30px;top:60px}.orb i:nth-child(2){right:-40px;top:-10px;animation-duration:8s}
@keyframes mist{to{transform:translate(40px,-30px) scale(1.2)}}
.orb.clear{width:110px;height:110px}.orb.clear i{opacity:0}
.orb.clear:after{content:"🍿";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;animation:fade 1s both}
.vis{max-width:340px;text-align:center;font-size:21px;line-height:1.4;position:relative}
.vis p{margin-top:12px;opacity:0;animation:fade .8s both}
.vis b{color:#d9ccff;font-weight:700}
.or .btns{position:relative}
.or .btns .y{background:#b9a8ff;color:#140c33}.or .btns .n{border:1px solid #b9a8ff88;color:#dcd3ff;background:none}
</style></head><body>
<div id="stage"></div><div id="toast"></div>
<script>
const PREVIEW=false, TG_USER='', TG_TEXT='Я за кино 🍿', NTFY='asana-61012dfbb194';
const stage=document.getElementById('stage'),toast=document.getElementById('toast');let run=0,tt,pinged=false;
function ping(){if(PREVIEW||!NTFY||pinged)return;pinged=true;try{fetch('https://ntfy.sh/'+NTFY,{method:'POST',body:'Асана: отказ (Остаюсь дома)',keepalive:true}).catch(()=>{})}catch(e){}}
function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),3800)}
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const wait=(ms,r)=>new Promise(res=>setTimeout(()=>{if(r===run)res()},ms));
function yes(label){const a=el('a','y',label);if(TG_USER){a.href=`https://t.me/${TG_USER}?text=${encodeURIComponent(TG_TEXT)}`;a.target='_blank';a.rel='noopener'}else{a.href='#';a.onclick=e=>{e.preventDefault();say('Здесь у неё откроется чат в Telegram с готовым текстом «'+TG_TEXT+'». Нужен ник нового аккаунта.')}}return a}
function btns(root,k,yl,nl,h,p){const b=el('div','btns');const n=el('button','n',nl);
  n.onclick=()=>{ping();if(PREVIEW)say('В финальной версии в этот момент тебе придёт уведомление об отказе.');root.innerHTML='';const d=el('div','end',`<h2>${h}</h2><p>${p}</p>`);const bk=el('button','back','Передумала? Вернуться');bk.onclick=()=>show(k);d.append(bk);root.append(d)};
  b.append(yes(yl),n);root.append(b)}
const SOFT='Без обид.<br>Шоколадка всё равно твоя :)';

const V={
scroll(root){root.className='v sc';
  root.innerHTML=`<div class="hd">Послание</div><div class="parch"><h2>Сим объявляется поход</h2><button class="seal">✦</button><div class="ln" style="animation-delay:.9s">Цель: <i>кино</i>. Срок: <i>на выходных</i>.</div><div class="ln" style="animation-delay:1.5s">Отряд: двое.<br>Провиант: попкорн, за мой счёт.</div><div class="ln" style="animation-delay:2.1s">Фильм выбирает та,<br>что держит этот свиток.</div></div><div class="tap" style="margin-top:20px">сломай печать</div>`;
  const p=root.querySelector('.parch'),r=run;
  root.querySelector('.seal').onclick=async()=>{p.classList.add('open');root.querySelector('.tap').remove();await wait(2900,r);btns(root,'scroll','В поход','Остаюсь дома','Свиток свёрнут',SOFT)}},

async diary(root){const r=run;root.className='v di';
  root.innerHTML=`<div class="hd">Страница из дневника</div><div class="pg"></div>`;
  const pg=root.querySelector('.pg');
  const T='Дорогой дневник,\n\nсегодня я подарил ей шоколадку. На ней был QR-код. Она его открыла — значит, читает это прямо сейчас.\n\nГоворят, вампиру нельзя войти без приглашения. Мне проще: я сам зову её в кино на выходных.\n\nФильм выберет она.';
  let skip=false;pg.onclick=()=>skip=true;
  await wait(400,r);
  for(let i=1;i<=T.length;i++){pg.textContent=T.slice(0,i);if(!skip)await wait(T[i-1]=='\n'?160:26,r)}
  btns(root,'diary','Впустить','Закрыть дневник','Дневник закрыт',SOFT)},

lot(root){const r=run;root.className='v lo';
  const slips=[[-58,104,-24],[-12,112,14],[30,100,-8],[52,116,26],[-36,124,6],[8,128,-18]].map(([x,y,a])=>`<rect x="${130+x-30}" y="${y}" width="60" height="20" rx="2" fill="#f3ead6" opacity=".9" transform="rotate(${a} ${130+x} ${y+10})"/>`).join('');
  root.innerHTML=`<div class="hd">Церемония</div><div class="h1">Жребий брошен</div><div class="bowlw"><svg viewBox="0 0 260 230"><ellipse cx="130" cy="92" rx="112" ry="20" fill="#ffffff14" stroke="#cfd6e0" stroke-width="2"/>${slips}<path d="M18 92c0 78 50 118 112 118s112-40 112-118" fill="#9fb6d620" stroke="#cfd6e0" stroke-width="2"/><ellipse cx="130" cy="214" rx="46" ry="8" fill="#cfd6e055"/><path d="M48 120c6 36 26 60 54 72" stroke="#fff" stroke-width="3" opacity=".35" fill="none" stroke-linecap="round"/></svg><div class="slip"></div></div><button class="tap" style="background:none;border:0;color:inherit">тяни жребий</button>`;
  const go=async()=>{root.querySelector('.tap').remove();const s=root.querySelector('.slip');s.style.top='-10px';s.style.transform='scale(1.6) rotate(-4deg)';await wait(1000,r);
    root.querySelector('.bowlw').remove();root.querySelector('.h1').textContent='Жребий выпал тебе';
    root.append(el('div','card','<small>на этой бумажке</small><h2>КИНО</h2><p>На выходных. Напарник — я.<br>Фильм выбираешь ты, попкорн с меня.</p>'));root.querySelector('.card').style.marginTop='26px';
    await wait(900,r);btns(root,'lot','Иду добровольцем','Пропускаю','Жребий возвращён',SOFT)};
  root.querySelector('.tap').onclick=go;root.querySelector('.bowlw').onclick=go},

orb(root){const r=run;root.className='v or';
  root.innerHTML=`<div class="hd">Пророчество</div><button class="orb"><i></i><i></i></button><div class="tap">коснись шара</div><div class="vis"></div>`;
  const o=root.querySelector('.orb');
  o.onclick=async()=>{if(o.classList.contains('clear'))return;o.classList.add('clear');root.querySelector('.tap').remove();
    root.querySelector('.vis').innerHTML='<p style="animation-delay:.8s">Шар показывает: <b>тёмный зал, большой экран, попкорн.</b></p><p style="animation-delay:1.6s">Время — <b>на выходных</b>. Рядом тот, кто подарил шоколадку.</p><p style="animation-delay:2.4s">Фильм выбираешь ты. Пророчество сбудется, только если ты согласна.</p>';
    await wait(3300,r);btns(root,'orb','Пусть сбудется','Развеять','Видение развеяно',SOFT)}}
};
function show(){run++;stage.innerHTML='';const root=el('div','v');stage.append(root);V.scroll(root)}
show();
</script></body></html>
